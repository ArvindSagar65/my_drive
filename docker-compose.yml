volumes:
    minio_data:

services:
    minio:
        image: quay.io/minio/minio:latest
        container_name: minio
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: admin
            MINIO_ROOT_PASSWORD: arjun1388
        volumes:
            - minio_data:/data
        command: server /data --console-address ":9001"
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s

    tunnel:
        image: cloudflare/cloudflared:latest
        profiles: ["public"]
        network_mode: host
        command: tunnel --no-autoupdate --url http://localhost:5000
